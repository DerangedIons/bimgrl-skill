[project]
name = "bimgrl"
version = "0.1.0"
description = "Apply the block-implicit multirate generalized Rush-Larsen (BIMGRL) scheme to a cardiac cell model: stiffness, invariants, blocks, codegen, validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "myokit>=1.36",
    "lxml>=5",
]

[project.scripts]
bimgrl = "bimgrl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bimgrl"]
