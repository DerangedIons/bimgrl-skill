[project]
name = "birlm"
version = "0.2.0"
description = "Apply block Rush-Larsen (BIRL-M by default, or the paper's BIMGRL) to a cardiac cell model: stiffness, invariants, blocks, codegen, validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "myokit>=1.36",
    "lxml>=5",
]

[project.scripts]
birlm = "birlm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birlm"]
